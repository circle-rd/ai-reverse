# Agent next to a local inference engine. It dials out; it publishes no port.
# `network_mode: host` lets it reach an engine bound to 127.0.0.1.
# First start: the agent prints a link and a code (`docker compose logs`); open the link,
# sign in and approve. The credential is kept in the `agent-state` volume.
# Non-secret settings come from .env (copy .env.example); the engine key stays in a secret.
services:
  reverse-agent:
    # For GPU load, memory, temperature, power and the GPU processes use the `-gpu` image,
    # uncomment `gpus` (NVIDIA, needs the NVIDIA container toolkit on the host) and
    # `pid: host`; an AMD or Intel GPU needs `devices: [/dev/dri]` and
    # `group_add: ["<render gid>"]` instead.
    # image: ghcr.io/circle-rd/ai-reverse-agent-gpu:latest
    # gpus: all
    # pid: host
    image: ghcr.io/circle-rd/ai-reverse-agent:latest
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env
    volumes:
      - agent-state:/var/lib/reverse-agent
      # For owner-only host grouping, enable AGENT_MACHINE_ID_FILE in .env too.
      # - /etc/machine-id:/run/host-machine-id:ro
    secrets:
      - upstream_api_key

volumes:
  agent-state:

secrets:
  upstream_api_key:
    file: ./secrets/upstream_api_key
