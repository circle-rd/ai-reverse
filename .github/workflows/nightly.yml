name: Nightly — Docker images (nightly)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "develop"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push nightly (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            dockerfile: Dockerfile
          - name: agent-gpu
            dockerfile: Dockerfile
            target: gpu
          - name: relay
            dockerfile: Dockerfile.relay
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.name }}
      PACKAGE_NAME: ${{ github.event.repository.name }}-${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit SHA
        id: sha
        run: echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find current nightly version
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api --paginate "/orgs/${{ github.repository_owner }}/packages/container/${{ env.PACKAGE_NAME }}/versions" \
            --jq '.[] | select(.metadata.container.tags | index("nightly")) | .id' | head -n1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.full }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Delete superseded nightly version
        if: steps.previous.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="/orgs/${{ github.repository_owner }}/packages/container/${{ env.PACKAGE_NAME }}/versions"
          current=$(gh api --paginate "$base" --jq '.[] | select(.metadata.container.tags | index("nightly")) | .id' | head -n1)
          if [ "$current" != "${{ steps.previous.outputs.id }}" ]; then
            gh api -X DELETE "$base/${{ steps.previous.outputs.id }}"
          fi
